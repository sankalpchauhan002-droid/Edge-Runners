<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edge Runners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Oxanium:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="controls-container" class="glass-panel" style="display: none;">
            <button id="btn-fullscreen" class="icon-btn">⛶ Fullscreen</button>
            <button id="btn-music" class="icon-btn">🔊 Unmute</button>
            <button id="btn-pause" class="icon-btn">⏸ Pause</button>
        </div>
        
        <div id="store-container" class="glass-panel HUD" style="display: none; top: 130px; right: 30px; flex-direction: column; gap: 8px; padding: 15px; width: auto;">
            <div class="hud-label" style="text-align: center; margin-bottom: 5px;">STORE</div>
            <button id="btn-buy-magnet" class="icon-btn" style="font-size: 14px; padding: 8px 12px;" title="Magnet (10s) - Collects nearby coins">[1] 🧲 Magnet (30)</button>
            <button id="btn-buy-tranq" class="icon-btn" style="font-size: 14px; padding: 8px 12px;" title="Tranquilizer - Reduces speed by 20%">[2] 💉 Tranq (80)</button>
            <button id="btn-buy-rocket" class="icon-btn" style="font-size: 14px; padding: 8px 12px;" title="Rocket - Destroys obstacle ahead">[3] 🚀 Rocket (20)</button>
        </div>
        
        <div id="score-container" class="glass-panel HUD" style="display: none;">
            <div class="hud-item" style="color: #ffd700;">
                <span class="hud-label">HIGH SCORE</span>
                <span id="highscore" class="hud-value">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">SCORE</span>
                <span id="score" class="hud-value">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">COINS</span>
                <span id="coins" class="hud-value">0</span>
            </div>
        </div>

        <div id="powerup-container" class="glass-panel HUD" style="display: none; top: 220px; left: 30px; flex-direction: column; align-items: center; min-width: 200px;">
            <div id="powerup-name" class="hud-label" style="color: #00ffff; text-shadow: 0 0 5px #00ffff; font-size: 1.2em; margin-bottom: 2px; text-align: center;">POWERUP</div>
            <div id="powerup-desc" style="font-size: 0.75em; margin-bottom: 6px; text-align: center; font-style: italic; opacity: 0.8; letter-spacing: 1px;">DESC</div>
            <div style="width: 100%; height: 8px; background-color: rgba(255, 255, 255, 0.2); border-radius: 4px; overflow: hidden; margin-bottom: 5px;">
                <div id="powerup-bar" style="width: 100%; height: 100%; background-color: #00ffff; transform-origin: left; transition: transform 0.1s linear;"></div>
            </div>
            <div id="powerup-queue" style="display: flex; gap: 5px; width: 100%; justify-content: center; flex-wrap: wrap;"></div>
        </div>

        <div id="pause-screen" class="glass-overlay" style="display: none;">
            <h1 class="neon-title">GAME PAUSED</h1>
            <div class="stats-grid">
                <div class="stat-box">
                    <span>Current Score</span>
                    <h2 id="pause-score">0</h2>
                </div>
                <div class="stat-box">
                    <span>Coins Collected</span>
                    <h2 id="pause-coins">0</h2>
                </div>
                <div class="stat-box">
                    <span>Current Speed</span>
                    <h2 id="pause-speed">0.0</h2>
                </div>
            </div>
            <p>Press Pause to Resume</p>
        </div>

        <!-- YouTube IFrame API -->
        <div id="yt-player-container" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; top: 0; left: 0;">
            <div id="yt-player"></div>
        </div>
        <script>
            window.ytPlayer = null;
            function onYouTubeIframeAPIReady() {
                window.ytPlayer = new YT.Player('yt-player', {
                    height: '0',
                    width: '0',
                    videoId: '8y1VdQR-o_U', // User specified track
                    playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': '8y1VdQR-o_U', 'start': 0 },
                    events: {
                        'onReady': (event) => {
                            event.target.mute(); // Start muted for policy compliance
                        },
                        'onError': (event) => {
                            console.error("YouTube Error Code: ", event.data);
                            if (event.data === 150 || event.data === 101) {
                                document.getElementById('btn-music').innerText = "TRACK BLOCKED";
                            }
                        }
                    }
                });
            }
        </script>
        <script src="https://www.youtube.com/iframe_api"></script>
        <div id="start-screen" style="display: none;">
            <h1>Edge Runners</h1>
            <p>Select Your Character</p>
            <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;">
                <button id="char2-btn" class="char-select-btn" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">Max</button>
                <button id="char1-btn" class="char-select-btn" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">Misha</button>
                <button id="char3-btn" class="char-select-btn" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">Robot</button>
                <button id="char4-btn" class="char-select-btn" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">Soldier</button>
            </div>
            <!-- The Start Game button can be removed because selecting a character will start the game -->
        </div>
        <div id="game-over" style="display: none;">
            <h1>Game Over</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Click to Restart</button>
        </div>
        <div id="loading" style="display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #1a2a3a 0%, #0a1128 100%); position: absolute; width: 100%; height: 100%; z-index: 1000; top: 0; left: 0;">
            <h1 class="neon-title" style="margin-bottom: 30px; font-size: 3rem; letter-spacing: 4px;">SYSTEM INIT</h1>
            
            <div style="width: 70%; max-width: 400px; height: 8px; background-color: rgba(0, 0, 0, 0.5); border-radius: 4px; border: 1px solid rgba(0, 255, 255, 0.3); overflow: hidden; box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);">
                <div id="loading-bar-fill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); box-shadow: 0 0 10px #00d2ff; transition: width 0.1s linear;"></div>
            </div>
            
            <div id="loading-text" style="color: #00ffff; font-family: 'Oxanium', sans-serif; font-size: 1.2rem; margin-top: 15px; text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); letter-spacing: 2px;">
                0%
            </div>
        </div>
    </div>
    
    <script type="module" src="js/main.js?v=23"></script>
</body>
</html>
